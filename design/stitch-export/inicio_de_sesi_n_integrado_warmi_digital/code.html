<body class="bg-surface text-on-surface min-h-screen flex flex-col md:flex-row font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">

<div class="w-full md:w-1/2 lg:w-5/12 min-h-screen flex items-center justify-center p-container-padding relative">
<div class="absolute top-8 left-8 md:top-12 md:left-12">
<span class="font-headline-md text-headline-md text-primary tracking-tight">Warmi Digital</span>
</div>
<div class="w-full max-w-md soft-fade">
<div class="mb-12"><div class="flex bg-surface-container-low p-1 rounded-full mb-8 w-fit mx-auto md:mx-0">
<button class="px-6 py-2 rounded-full font-label-ui text-label-ui transition-all duration-300 bg-primary text-on-primary" id="btn-artesana" onclick="updateRole('artesana')">
        Soy Artesana
    </button>
<button class="px-6 py-2 rounded-full font-label-ui text-label-ui transition-all duration-300 text-on-surface-variant hover:text-primary" id="btn-facilitadora" onclick="updateRole('facilitadora')">
        Soy Facilitadora
    </button>
</div>
<div class="flex items-center gap-3 mb-4">
<span class="material-symbols-outlined text-primary text-3xl" id="role-icon">front_hand</span>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface" id="welcome-title">Bienvenida a tu taller</h1>
</div>
<p class="font-body-lg text-body-lg text-on-surface-variant">Accede a tu cuenta para continuar gestionando tus creaciones y preservando nuestra herencia.</p>
</div>
<form action="#" class="space-y-8" method="POST">
<div class="relative group">
<input class="material-input w-full bg-transparent border-t-0 border-l-0 border-r-0 py-3 px-0 text-on-surface font-body-md placeholder-transparent focus:ring-0 transition-colors duration-300" id="username" name="username" placeholder="Username/Email" required="" type="text"/>
<label class="absolute left-0 top-3 text-on-surface-variant font-body-md transition-all duration-300 -translate-y-7 scale-75 origin-left peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-7 peer-focus:scale-75 peer-focus:text-primary pointer-events-none" for="username">Usuario / Correo</label>
</div>
<div class="relative group">
<input class="material-input w-full bg-transparent border-t-0 border-l-0 border-r-0 py-3 px-0 text-on-surface font-body-md placeholder-transparent focus:ring-0 transition-colors duration-300" id="password" name="password" placeholder="Password" required="" type="password"/>
<label class="absolute left-0 top-3 text-on-surface-variant font-body-md transition-all duration-300 -translate-y-7 scale-75 origin-left peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-7 peer-focus:scale-75 peer-focus:text-primary pointer-events-none" for="password">Contraseña</label>
</div>
<div class="pt-6">
<button class="w-full bg-primary text-on-primary font-label-ui text-label-ui py-4 px-6 rounded-full hover:bg-primary-container hover:text-on-primary-container transition-all duration-300 ease-out shadow-sm hover:shadow-md flex justify-center items-center gap-2" type="submit">
                        Iniciar Sesión
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-12 text-center">
<a class="font-label-ui text-label-ui text-primary hover:text-primary-container hover:underline decoration-primary/30 underline-offset-4 transition-all duration-300" href="#">
                    Unirse como artesana
                </a>
</div>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.material-input');
            
            inputs.forEach(input => {
                const label = input.nextElementSibling;
                
                if(input.value) {
                    label.classList.add('-translate-y-7', 'scale-75', 'text-primary');
                }

                input.addEventListener('focus', () => {
                    label.classList.add('-translate-y-7', 'scale-75', 'text-primary');
                });

                input.addEventListener('blur', () => {
                    if (!input.value) {
                        label.classList.remove('-translate-y-7', 'scale-75', 'text-primary');
                    } else {
                        label.classList.remove('text-primary'); 
                    }
                });
            });
        });
    </script>
<script>
function updateRole(role) {
    const btnArtesana = document.getElementById('btn-artesana');
    const btnFacilitadora = document.getElementById('btn-facilitadora');
    const title = document.getElementById('welcome-title');
    const icon = document.getElementById('role-icon');
    const desc = document.querySelector('div.mb-12 > p');

    if (role === 'artesana') {
        btnArtesana.className = 'px-6 py-2 rounded-full font-label-ui text-label-ui transition-all duration-300 bg-primary text-on-primary';
        btnFacilitadora.className = 'px-6 py-2 rounded-full font-label-ui text-label-ui transition-all duration-300 text-on-surface-variant hover:text-primary';
        title.innerText = 'Bienvenida a tu taller';
        icon.innerText = 'front_hand';
        desc.innerText = 'Accede a tu cuenta para continuar gestionando tus creaciones y preservando nuestra herencia.';
    } else {
        btnFacilitadora.className = 'px-6 py-2 rounded-full font-label-ui text-label-ui transition-all duration-300 bg-primary text-on-primary';
        btnArtesana.className = 'px-6 py-2 rounded-full font-label-ui text-label-ui transition-all duration-300 text-on-surface-variant hover:text-primary';
        title.innerText = 'Bienvenida, Facilitadora';
        icon.innerText = 'groups';
        desc.innerText = 'Accede a tu cuenta para continuar guiando a nuestra comunidad y midiendo el impacto.';
    }
}
</script></body></html>
