<script>
        // Micro-interaction logic to handle the custom radio button dots
        document.addEventListener('DOMContentLoaded', () => {
            const radios = document.querySelectorAll('input[name="specialty"]');
            
            function updateIndicators() {
                radios.forEach(radio => {
                    const indicatorDot = radio.closest('label').querySelector('.indicator-dot');
                    const indicatorRing = radio.closest('label').querySelector('.radio-indicator');
                    
                    if (radio.checked) {
                        indicatorDot.classList.remove('scale-0');
                        indicatorDot.classList.add('scale-100');
                        indicatorRing.classList.add('border-primary');
                        indicatorRing.classList.remove('border-outline-variant/50');
                    } else {
                        indicatorDot.classList.add('scale-0');
                        indicatorDot.classList.remove('scale-100');
                        indicatorRing.classList.remove('border-primary');
                        indicatorRing.classList.add('border-outline-variant/50');
                    }
                });
            }

            radios.forEach(radio => {
                radio.addEventListener('change', updateIndicators);
            });

            // Initialize on load
            updateIndicators();
        });
    </script>
